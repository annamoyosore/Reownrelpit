<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiChain Wallet Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: white;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #172337;
  border: 1px solid #293b54;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 18px;
}

h1, h2 {
  margin-top: 0;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border-radius: 8px;
  border: 1px solid #42516a;
  background: #0b1220;
  color: white;
}

button {
  padding: 13px 18px;
  border: 0;
  border-radius: 8px;
  background: #16a34a;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

button:hover:not(:disabled) {
  opacity: .85;
}

.logout {
  background: #dc2626;
}

.action-btn {
  background: #2563eb;
  white-space: nowrap;
}

.hidden {
  display: none;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.stat {
  background: #0b1220;
  padding: 20px;
  border-radius: 10px;
}

.stat strong {
  display: block;
  font-size: 27px;
  margin-top: 10px;
  color: #4ade80;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th, td {
  padding: 13px;
  border-bottom: 1px solid #293b54;
  text-align: left;
  font-size: 13px;
  word-break: break-word;
}

th {
  color: #4ade80;
}

.status {
  color: #4ade80;
}

#message,
#transferMessage {
  color: #f87171;
  margin-top: 12px;
  font-size: 14px;
}

.small,
.section-note {
  color: #9ca3af;
  font-size: 13px;
  line-height: 1.6;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.success {
  color: #4ade80 !important;
}
</style>
</head>

<body>

<div class="container">

  <!-- ORIGINAL ADMIN LOGIN -->

  <div id="loginSection" class="card">

    <h1>MultiChain Wallet</h1>

    <h2>Administrator Access</h2>

    <p class="small">
      Enter administrator password to continue.
    </p>

    <form id="loginForm">

      <input
        type="password"
        id="password"
        placeholder="Administrator password"
        autocomplete="current-password"
        required
      >
