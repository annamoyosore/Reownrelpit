<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MultiChain Wallet Admin</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: white;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #172337;
  border: 1px solid #293b54;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 18px;
}

h1, h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border-radius: 8px;
  border: 1px solid #42516a;
  background: #0b1220;
  color: white;
}

button {
  padding: 13px 18px;
  border: 0;
  border-radius: 8px;
  background: #16a34a;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.logout {
  background: #dc2626;
}

.hidden {
  display: none;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.stat {
  background: #0b1220;
  padding: 20px;
  border-radius: 10px;
}

.stat strong {
  display: block;
  font-size: 27px;
  margin-top: 10px;
  color: #4ade80;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th, td {
  padding: 13px;
  border-bottom: 1px solid #293b54;
  text-align: left;
  font-size: 13px;
}

th {
  color: #4ade80;
}

.status {
  color: #4ade80;
}

#message {
  color: #f87171;
  margin-top: 12px;
  font-size: 14px;
}

.small {
  color: #9ca3af;
  font-size: 12px;
}
</style></head><body><div class="container">  <!-- ADMIN LOGIN -->  <div id="loginSection" class="card"><h1>MultiChain Wallet</h1>

<h2>Administrator Access</h2>

<p class="small">
  Enter your authorised administrator Gmail to continue.
</p>

<form id="loginForm">

  <input
    type="email"
    id="email"
    placeholder="Administrator Gmail"
    autocomplete="email"
    required
  >

  <button type="submit" id="loginButton">
    Unlock Dashboard
  </button>

</form>

<div id="message"></div>

  </div>  <!-- ADMIN DASHBOARD -->  <div id="dashboard" class="hidden"><div class="card">

  <h1>Admin Dashboard</h1>

  <p class="small">
    Connected Wallet Monitoring
  </p>

  <button onclick="loadWallets()">
    Refresh Wallets
  </button>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>


<!-- STATISTICS -->

<div class="stats">

  <div class="card stat">
    Total Wallets
    <strong id="totalWallets">0</strong>
  </div>

  <div class="card stat">
    Connected
    <strong id="connectedWallets">0</strong>
  </div>

  <div class="card stat">
    Networks
    <strong id="totalNetworks">0</strong>
  </div>

</div>


<!-- WALLET RECORDS -->

<div class="card">

  <h2>Connected Wallets</h2>

  <input
    type="text"
    id="search"
    placeholder="Search wallet address or network..."
    oninput="filterWallets()"
  >

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Wallet Address</th>
          <th>Network</th>
          <th>Chain ID</th>
          <th>Status</th>
          <th>Connected At</th>
          <th>Last Seen</th>
        </tr>
      </thead>

      <tbody id="walletTable">

        <tr>
          <td colspan="6">
            No wallet records loaded.
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

  </div></div><script>

const API_URL = "/api/admin-wallets";

let wallets = [];

let authorisedEmail = "";


const loginSection =
  document.getElementById("loginSection");

const dashboard =
  document.getElementById("dashboard");

const message =
  document.getElementById("message");


// SHOW DASHBOARD

function showDashboard() {

  loginSection.classList.add("hidden");

  dashboard.classList.remove("hidden");

}


// SHOW LOGIN

function showLogin() {

  dashboard.classList.add("hidden");

  loginSection.classList.remove("hidden");

}


// VERIFY ADMIN EMAIL AND LOAD WALLETS

async function verifyAdmin(email) {

  const response = await fetch(API_URL, {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      email: email
    })

  });

  const data = await response.json();

  if (!response.ok || !data.authorised) {

    throw new Error(
      data.error || "Administrator verification failed."
    );

  }

  return data;

}


// LOGIN FORM

document.getElementById("loginForm")

.addEventListener("submit", async function(e) {

  e.preventDefault();

  message.textContent = "";

  const button =
    document.getElementById("loginButton");

  button.disabled = true;

  button.textContent = "Verifying...";

  try {

    const email = document
      .getElementById("email")
      .value.trim();

    // Verify email through Vercel API.

    const data = await verifyAdmin(email);

    authorisedEmail = email;

    showDashboard();

    // Display returned wallet records.

    wallets = data.wallets || [];

    updateDashboard();

  } catch (error) {

    authorisedEmail = "";

    message.textContent =
      error.message || "Verification failed.";

  } finally {

    button.disabled = false;

    button.textContent = "Unlock Dashboard";

  }

});


// REFRESH WALLET RECORDS

async function loadWallets() {

  if (!authorisedEmail) {

    logout();

    return;

  }

  const tbody =
    document.getElementById("walletTable");

  tbody.innerHTML =
    "<tr><td colspan='6'>Loading wallets...</td></tr>";

  try {

    const data = await verifyAdmin(authorisedEmail);

    wallets = data.wallets || [];

    updateDashboard();

  } catch (error) {

    tbody.innerHTML =
      `<tr><td colspan="6">${escapeHtml(error.message)}</td></tr>`;

  }

}


// UPDATE DASHBOARD

function updateDashboard() {

  renderWallets(wallets);

  document.getElementById("totalWallets")
    .textContent = wallets.length;

  document.getElementById("connectedWallets")
    .textContent = wallets.filter(
      w => w.connectionStatus === "connected"
    ).length;

  const networks = new Set(
    wallets.map(w => w.network).filter(Boolean)
  );

  document.getElementById("totalNetworks")
    .textContent = networks.size;

}


// RENDER WALLET TABLE

function renderWallets(items) {

  const tbody =
    document.getElementById("walletTable");

  if (!items.length) {

    tbody.innerHTML =
      "<tr><td colspan='6'>No connected wallets found.</td></tr>";

    return;

  }

  tbody.innerHTML = items.map(wallet => `

    <tr>

      <td>
        ${escapeHtml(wallet.walletAddress || "")}
      </td>

      <td>
        ${escapeHtml(wallet.network || "")}
      </td>

      <td>
        ${escapeHtml(String(wallet.chainId ?? ""))}
      </td>

      <td class="status">
        ${escapeHtml(wallet.connectionStatus || "")}
      </td>

      <td>
        ${formatDate(wallet.connectedAt)}
      </td>

      <td>
        ${formatDate(wallet.lastSeenAt)}
      </td>

    </tr>

  `).join("");

}


// SEARCH WALLETS

function filterWallets() {

  const query = document
    .getElementById("search")
    .value.toLowerCase();

  const filtered = wallets.filter(wallet => {

    return (

      (wallet.walletAddress || "")
        .toLowerCase()
        .includes(query)

      ||

      (wallet.network || "")
        .toLowerCase()
        .includes(query)

    );

  });

  renderWallets(filtered);

}


// FORMAT DATE

function formatDate(value) {

  if (!value) return "-";

  const date = new Date(value);

  if (isNaN(date.getTime())) return "-";

  return date.toLocaleString();

}


// ESCAPE HTML

function escapeHtml(value) {

  return String(value).replace(/[&<>"']/g, char => ({

    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"

  })[char]);

}


// LOGOUT

function logout() {

  wallets = [];

  authorisedEmail = "";

  document.getElementById("email").value = "";

  document.getElementById("search").value = "";

  document.getElementById("totalWallets").textContent = "0";

  document.getElementById("connectedWallets").textContent = "0";

  document.getElementById("totalNetworks").textContent = "0";

  document.getElementById("walletTable").innerHTML =
    "<tr><td colspan='6'>No wallet records loaded.</td></tr>";

  message.textContent = "";

  showLogin();

}

showLogin();

</script></body>
</html>
